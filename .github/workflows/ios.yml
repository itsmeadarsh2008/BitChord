name: iOS CI

# No local Mac needed — macos-latest IS the Mac. This workflow compiles the
# :shared Kotlin/Native framework and the iosApp shell on GitHub's runner.
#
# What this produces WITHOUT signing (default, free):
#   - :shared framework for iosSimulatorArm64 / iosX64 / iosArm64
#   - iosApp Simulator .app (CODE_SIGNING_ALLOWED=NO)
#   - unsigned device .ipa (iphoneos build, zipped Payload — sideload it
#     with a FREE Apple ID via Sideloadly / AltStore / SideStore; expires
#     every 7 days, refresh over Wi-Fi)
# What needs Apple signing (paid Developer account + Secrets):
#   - distributable .ipa via xcodebuild archive + -exportArchive
#   - distributable .ipa via xcodebuild archive + -exportArchive
#   Required secrets: APPLE_CERT_P12, APPLE_CERT_PASSWORD,
#   PROVISIONING_PROFILE, KEYCHAIN_PASSWORD, TEAM_ID

on: [push, pull_request]

jobs:
  shared-framework:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # macos-15 images ship a full Android SDK preinstalled
      # (/Users/runner/Library/Android/sdk) — no setup step needed.
      # (android-actions/setup-android@v3 was removed: its default
      # `packages: tools platform-tools` fails since the obsolete `tools`
      # package no longer exists in the SDK repository.)
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platform-tools" | head -n 5

      - name: Setup local.properties stub
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check shared targets
        run: ./gradlew :shared:tasks --all | grep -i -E "ios|framework|xcode" || true

      - name: Run shared common tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Build shared Android library
        run: ./gradlew :shared:assembleDebug --stacktrace

      - name: Link shared iOS frameworks
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkIosX64 --stacktrace

  ios-app-simulator:
    needs: shared-framework
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # macos-15 images ship a full Android SDK preinstalled — no setup step.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools" | head -n 5

      - name: Setup local.properties stub
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show Xcode version
        run: xcodebuild -version && xcrun simctl list devices available | head -n 20

      - name: Build iosApp for Simulator (unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-ios-simulator
          path: build/ios-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn

  ios-device-unsigned:
    # Unsigned device .ipa for free-Apple-ID sideloading. No signing assets
    # needed: Xcode builds with CODE_SIGNING_ALLOWED=NO, then we zip the
    # .app as Payload/<app>.app per the .ipa layout. Install with
    # Sideloadly / AltStore / SideStore (they re-sign with your free ID).
    needs: shared-framework
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # macos-15 images ship a full Android SDK preinstalled — no setup step.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools" | head -n 5

      - name: Setup local.properties stub
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iosApp for device (unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-device-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          APP=$(echo build/ios-device-derived/Build/Products/Release-iphoneos/*.app)
          echo "App bundle: $APP"
          rm -rf Payload bitchord-ios-device-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r bitchord-ios-device-unsigned.ipa Payload

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-ios-device-unsigned
          path: bitchord-ios-device-unsigned.ipa
          if-no-files-found: error
